# .github/workflows/release.yml
#
# Build a .deb with scripts/build-deb.sh and attach it to a GitHub Release.
# Triggered by pushing a tag like v3.10.2 (or manually from the Actions tab).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v3.10.2)'
        required: true

permissions:
  contents: write

jobs:
  deb:
    runs-on: ubuntu-latest

    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y \
            gettext \
            libglib2.0-bin \
            make \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-setuptools-scm \
            python3-wheel \
            python3-packaging

      - name: Build .deb
        run: ./scripts/build-deb.sh "${TAG#v}"

      - name: Smoke test (install the package on the runner)
        run: |
          sudo apt-get install -y xvfb ./dist/guake_*_all.deb
          # Leave the checkout, whose guake/ source folder would shadow the package.
          cd "$RUNNER_TEMP"
          dpkg -L guake | grep -q '^/usr/lib/python3/dist-packages/guake/paths.py$'
          python3 -c 'import guake.paths as p; assert p.GLADE_DIR == "/usr/share/guake", p.GLADE_DIR'
          xvfb-run -a guake --version

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/guake_*_all.deb --clobber
          else
            gh release create "$TAG" dist/guake_*_all.deb \
              --title "Guake $TAG" \
              --generate-notes
          fi
