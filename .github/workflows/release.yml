# .github/workflows/release.yml
#
# Build the .deb (scripts/build-deb.sh) and the .rpm (scripts/build-rpm.sh),
# install each one on its distribution as a smoke test, and attach both to a
# GitHub Release. Triggered by pushing a tag like v3.10.2 (or manually from
# the Actions tab: `gh workflow run Release -f tag=v3.10.2`).

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v3.10.2)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install --no-install-recommends -y \
            gettext \
            libglib2.0-bin \
            make \
            python3 \
            python3-pip \
            python3-setuptools \
            python3-setuptools-scm \
            python3-wheel \
            python3-packaging

      - name: Build .deb
        run: ./scripts/build-deb.sh "${TAG#v}"

      - name: Smoke test (install the package on the runner)
        run: |
          sudo apt-get install -y xvfb ./dist/guake_*_all.deb
          # Leave the checkout, whose guake/ source folder would shadow the package.
          cd "$RUNNER_TEMP"
          dpkg -L guake | grep -q '^/usr/lib/python3/dist-packages/guake/paths.py$'
          python3 -c 'import guake.paths as p; assert p.GLADE_DIR == "/usr/share/guake", p.GLADE_DIR'
          xvfb-run -a guake --version

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/guake_*_all.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Install build dependencies
        run: |
          dnf install -y -q rpm-build make gettext glib2 git findutils python3 python3-pip \
            python3-setuptools python3-setuptools_scm python3-wheel python3-packaging

      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build .rpm
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./scripts/build-rpm.sh "${TAG#v}"

      - name: Smoke test (install the package in the container)
        run: |
          dnf install -y -q ./dist/guake-*.noarch.rpm xorg-x11-server-Xvfb
          cd /tmp
          rpm -ql guake | grep -q '^/usr/share/guake/python/guake/paths.py$'
          xvfb-run -a guake --version

      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/guake-*.noarch.rpm

  release:
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "Guake $TAG" \
              --generate-notes
          fi
